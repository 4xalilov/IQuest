# Render Blueprint: API + PostgreSQL. Maxfiy qiymatlar (BOT_TOKEN va h.k.) Render panelida kiritiladi.
services:
  - type: web
    name: iquest-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: iquest-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_WEBHOOK_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TG_IDS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WEBAPP_URL
        sync: false
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
databases:
  - name: iquest-db
    databaseName: iquest
